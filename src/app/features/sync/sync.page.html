<ion-header>
  <ion-toolbar class="sync-bar">
    <ion-buttons slot="start">
      <ov-menu-button></ov-menu-button>
    </ion-buttons>

    <ion-title class="sync-title">Sync</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="sync-content">
  <ion-list lines="none">
    @if (signedIn()) {
      <ion-item>
        <ion-icon slot="start" class="mega-icon" src="assets/icons/mega.svg" aria-hidden="true"></ion-icon>
        <ion-label>{{ accountEmail() }}</ion-label>
        <ion-button slot="end" fill="clear" color="danger" (click)="signOut()">
          Sign out
        </ion-button>
      </ion-item>
    } @else {
      <ion-item button detail="false" (click)="openAccount()" aria-label="Sign in to MEGA">
        <ion-icon slot="start" class="mega-icon" src="assets/icons/mega.svg" aria-hidden="true"></ion-icon>
        <ion-label>MEGA</ion-label>
        <ion-icon slot="end" name="chevron-forward" aria-hidden="true"></ion-icon>
      </ion-item>
    }
  </ion-list>

  <ion-modal
    class="device-modal"
    [isOpen]="megaOpen()"
    (didDismiss)="megaOpen.set(false)"
  >
    <ng-template>
      <div class="modal-body">
        <ion-list-header>MEGA</ion-list-header>

        <ion-list lines="none">
          <ion-item>
            <ion-label position="stacked">Email</ion-label>
            <ion-input
              [value]="email()"
              (ionInput)="onEmail($event)"
              type="email"
              autocomplete="username"
              aria-label="MEGA email"
            ></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="stacked">Password</ion-label>
            <ion-input
              [value]="password()"
              (ionInput)="onPassword($event)"
              type="password"
              autocomplete="current-password"
              aria-label="MEGA password"
            ></ion-input>
          </ion-item>
          @if (needsCode()) {
            <ion-item>
              <ion-label position="stacked">Two-factor code</ion-label>
              <ion-input
                [value]="code()"
                (ionInput)="onCode($event)"
                inputmode="numeric"
                autocomplete="one-time-code"
                aria-label="Two-factor code"
              ></ion-input>
            </ion-item>
          }
        </ion-list>

        @if (accountError()) {
          <ion-note class="error">{{ accountError() }}</ion-note>
        }

        <div class="actions">
          <ion-button
            [disabled]="signingIn() || !email().trim() || !password()"
            (click)="signIn()"
          >
            @if (signingIn()) {
              <ion-spinner name="crescent"></ion-spinner>
            } @else {
              Sign in
            }
          </ion-button>
        </div>
      </div>
    </ng-template>
  </ion-modal>
</ion-content>
