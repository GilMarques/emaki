<ion-content [scrollY]="false">
  <div
    #stage
    class="stage"
    [style.filter]="canvasFilter()"
    [style.image-rendering]="imageRendering()"
    (pointerdown)="onStagePointerDown($event)"
    (pointermove)="onStagePointerMove($event)"
    (pointerup)="onStagePointerUp($event)"
    (pointercancel)="onStagePointerUp($event)"
  >
    @if (openBook() !== null) {
      <ov-book-spread
        [book]="openBook()"
        [style.transform]="panTransform()"
        [style.transform-origin]="'0 0'"
      />
     } @else {
       <div class="empty-state">
         <h1>No book open</h1>
         <p>Choose a book from Bookshelf to start reading.</p>
       </div>
     }
   </div>

  <ov-magnifier
    [active]="magnifierActive()"
    [pageUrl]="currentPageUrl()"
    [pointerX]="pointerX()"
    [pointerY]="pointerY()"
    [imageRect]="pageImageRect()"
    [viewportWidth]="viewportWidth()"
    [viewportHeight]="viewportHeight()"
    [naturalWidth]="naturalSize()?.width ?? 0"
    [naturalHeight]="naturalSize()?.height ?? 0"
    [zoom]="magnifierZoom()"
  />

  @if (showZoomLabel()) {
    <div class="zoom-label" aria-hidden="true">{{ zoomLabel() }}</div>
  }

</ion-content>

@if (pagesOpen()) {
  <div class="pages-backdrop" (click)="closePagesMenu()">
    <div class="pages-menu" (click)="$event.stopPropagation()">
      <div class="pages-header">
        <div class="pages-title">{{ openBook()?.title }}</div>
        <div class="pages-progress-label">{{ progress() }}</div>
      </div>
      <div class="pages-progress">
        <div class="progress-track">
          <div
            class="progress-fill"
            [style.width.%]="progressPercent()"
          ></div>
        </div>
      </div>
      <div class="pages-scroll">
        @for (page of pages(); track page.index; let i = $index) {
          <button
            type="button"
            class="page-thumb"
            [class.current]="i === currentIndex()"
            (click)="goToPage(i)"
            [attr.aria-label]="'Page ' + (i + 1)"
          >
            <ion-img class="thumb-img" [src]="page.url" [alt]="'Page ' + (i + 1)"></ion-img>
            <span class="thumb-num">{{ i + 1 }}</span>
          </button>
        }
      </div>
    </div>
  </div>
}
