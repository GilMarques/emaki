<ion-content [scrollY]="false">
  <div
    #stage
    class="stage"
    [style.filter]="canvasFilter()"
    [style.image-rendering]="imageRendering()"
    (pointerdown)="onStagePointerDown($event)"
    (pointermove)="onStagePointerMove($event)"
    (pointerup)="onStagePointerUp($event)"
    (pointercancel)="onStagePointerUp($event)"
  >
    @if (openBook() !== null) {
      <ov-book-spread
        [book]="openBook()"
        [style.transform]="panTransform()"
        [style.transform-origin]="'0 0'"
      />
    } @else {
      <div class="empty-state">
        <h1>No book open</h1>
        <p>Choose a book from File Browser to start reading.</p>
      </div>
    }
  </div>


  <ov-magnifier
    [active]="magnifierActive()"
    [pageUrl]="currentPageUrl()"
    [pointerX]="pointerX()"
    [pointerY]="pointerY()"
    [imageRect]="pageImageRect()"
    [viewportWidth]="viewportWidth()"
    [viewportHeight]="viewportHeight()"
    [naturalWidth]="naturalSize()?.width ?? 0"
    [naturalHeight]="naturalSize()?.height ?? 0"
    [zoom]="magnifierZoom()"
  />

  @if (showZoomLabel()) {
    <div class="zoom-label" aria-hidden="true">{{ zoomLabel() }}</div>
  }

  <button
    type="button"
    class="quick-actions-trigger"
    aria-label="Open quick actions"
    (click)="openQuickActions()"
  >
    <ion-icon ios="ellipsis-horizontal-circle-outline" md="ellipsis-horizontal-sharp"></ion-icon>
  </button>
</ion-content>

<ov-quick-actions-modal
  [isOpen]="quickActionsOpen()"
  (didDismiss)="closeQuickActions()"
/>
