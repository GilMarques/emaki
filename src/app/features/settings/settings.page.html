<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ov-menu-button></ov-menu-button>
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list-header>Display</ion-list-header>
  <ov-display-settings />

  <ion-list-header>Filters</ion-list-header>
  <ov-filters-settings />

  <ion-list-header>App</ion-list-header>
  <ion-list lines="inset">
    <ion-item>
      <ion-label>Reset all settings to defaults</ion-label>
      <ion-button slot="end" fill="outline" color="danger" (click)="resetToDefaults()">
        Reset
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-list-header>Debug</ion-list-header>
  <ion-list lines="inset">
    <ion-item routerLink="/logs" button detail>
      <ion-icon slot="start" name="bug-outline"></ion-icon>
      <ion-label>
        <h2>Debug logs</h2>
        <p>Console output, warnings and errors from this session and the saved file</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
