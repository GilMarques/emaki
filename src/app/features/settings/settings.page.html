<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ov-menu-button></ov-menu-button>
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list-header>App</ion-list-header>
  <ion-list lines="inset">
    <ion-item>
      <ion-icon slot="start" name="contrast-outline" aria-hidden="true"></ion-icon>
      <ion-select
        label="Interface theme"
        [value]="theme()"
        (ionChange)="onThemeChange($event)"
        interface="popover"
        aria-label="Interface theme"
      >
        @for (opt of themes; track opt.value) {
          <ion-select-option [value]="opt.value">{{ opt.label }}</ion-select-option>
        }
      </ion-select>
    </ion-item>
    <ion-item>
      <ion-icon slot="start" name="sunny-outline" aria-hidden="true"></ion-icon>
      <ion-label>Keep screen awake</ion-label>
      <ion-toggle
        slot="end"
        [checked]="keepAwake()"
        (ionChange)="onKeepAwakeChange($event)"
        aria-label="Keep screen awake while reading"
      ></ion-toggle>
    </ion-item>
    <ion-item>
      <ion-label>Reset all settings to defaults</ion-label>
      <ion-button slot="end" fill="outline" color="danger" (click)="resetToDefaults()">
        Reset
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-list-header>Debug</ion-list-header>
  <ion-list lines="inset">
    <ion-item routerLink="/logs" button detail>
      <ion-icon slot="start" name="bug-outline"></ion-icon>
      <ion-label>
        <h2>Debug logs</h2>
        <p>Console output, warnings and errors from this session and the saved file</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
