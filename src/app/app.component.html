<ion-app>
  <ion-router-outlet id="main-content"></ion-router-outlet>

  <ion-modal
    class="reader-sheet"
    [isOpen]="isReaderOpen()"
    [breakpoints]="[0, 1]"
    [initialBreakpoint]="1"
    handle="visible"
    swipeToClose="true"
    [canDismiss]="true"
    (didDismiss)="closeReader()"
  >
    <ng-template>
      <ov-viewer />
    </ng-template>
  </ion-modal>
</ion-app>
