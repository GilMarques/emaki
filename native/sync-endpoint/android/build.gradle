apply plugin: 'com.android.library'

android {
    namespace "com.openviewer.syncendpoint"
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    // The Capacitor library must be the project dependency, not the published
    // "com.capacitorjs:core" artifact: the app already includes
    // project(':capacitor-android'), and shipping both puts the same classes
    // into the APK twice, which fails the dex merge.
    implementation project(':capacitor-android')
}
