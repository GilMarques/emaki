ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // Turns a semver string into the monotonically increasing integer
    // Android's versionCode must be ("1.2.3" -> 10203). Pre-release and
    // build metadata suffixes are ignored. Used as the default when the CI
    // workflow does not pass an explicit -PemakiVersionCode.
    semverToVersionCode = { String version ->
        def core = version.replaceFirst(/^v/, '').split(/[-+]/)[0]
        def parts = []
        core.split('\\.').each { part ->
            parts << (part.isInteger() ? part.toInteger() : 0)
        }
        while (parts.size() < 3) {
            parts << 0
        }
        (parts[0] * 10000) + (parts[1] * 100) + parts[2]
    }
}